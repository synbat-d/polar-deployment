  - application-prod.yml
  name: edge-config

images:
- name: edge-service
  newName: ghcr.io/synbat-d/edge-service
  newTag: 74529e30a70289e7ef3e92981874d23852e95e33

replicas:
- count: 1
  name: edge-service
