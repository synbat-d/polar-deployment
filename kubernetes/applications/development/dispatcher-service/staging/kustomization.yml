apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github.com/synbat-d/dispatcher-service/k8s?ref=main
patchesStrategicMerge:
  - patch-env.yml
configMapGenerator:
  - behavior: merge
    files:
      - application-staging.yml
    name: dispatcher-config
images:
  - name: dispatcher-service
    newName: ghcr.io/synbat-d/dispatcher-service
    newTag: latest

replicas:
  - name: dispatcher-service
    count: 1